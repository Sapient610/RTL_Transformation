<rect width="900" height="510" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="450.0" y="36" text-anchor="middle" class="title">Sky130 总线反转架构物理面积开销与关键路径时序延迟对比</text><text x="450.0" y="56" text-anchor="middle" class="subtitle">汉明统计加法树与异或阵列导致面积增加 +63% ~ +84%，关键路径延迟延长至 4.7 ~ 8.2ns (Setup 裕量仍保持 &gt;1.67ns)</text><line x1="80" y1="405" x2="820" y2="405" class="zero-line"/><text x="70" y="409" text-anchor="end" class="tick-label">0 µm²</text><line x1="80" y1="368" x2="820" y2="368" class="grid-line"/><text x="70" y="372" text-anchor="end" class="tick-label">2000 µm²</text><line x1="80" y1="330" x2="820" y2="330" class="grid-line"/><text x="70" y="334" text-anchor="end" class="tick-label">4000 µm²</text><line x1="80" y1="293" x2="820" y2="293" class="grid-line"/><text x="70" y="297" text-anchor="end" class="tick-label">6000 µm²</text><line x1="80" y1="255" x2="820" y2="255" class="grid-line"/><text x="70" y="259" text-anchor="end" class="tick-label">8000 µm²</text><line x1="80" y1="217" x2="820" y2="217" class="grid-line"/><text x="70" y="221" text-anchor="end" class="tick-label">10000 µm²</text><line x1="80" y1="180" x2="820" y2="180" class="grid-line"/><text x="70" y="184" text-anchor="end" class="tick-label">12000 µm²</text><line x1="80" y1="142" x2="820" y2="142" class="grid-line"/><text x="70" y="146" text-anchor="end" class="tick-label">14000 µm²</text><line x1="80" y1="104" x2="820" y2="104" class="grid-line"/><text x="70" y="108" text-anchor="end" class="tick-label">16000 µm²</text><rect x="123.5" y="386" width="42" height="19" fill="#94a3b8" rx="2"/><text x="144.5" y="368" text-anchor="middle" class="data-label" fill="#475569">1061µm²</text><text x="144.5" y="380" text-anchor="middle" font-size="10px" fill="#64748b">(78门/0.93ns)</text><rect x="179.5" y="373" width="42" height="32" fill="#f59e0b" rx="2"/><text x="200.5" y="355" text-anchor="middle" class="data-label" fill="#b45309">1733µm²</text><text x="200.5" y="367" text-anchor="middle" font-size="10px" font-weight="700" fill="#b45309">(+63.3%/4.70ns)</text><text x="172.5" y="427" text-anchor="middle" class="axis-label">8-bit 总线</text><text x="144.5" y="441" text-anchor="middle" class="tick-label">原始总线</text><text x="200.5" y="441" text-anchor="middle" class="tick-label">Bus-Invert</text><rect x="308.5" y="366" width="42" height="39" fill="#94a3b8" rx="2"/><text x="329.5" y="348" text-anchor="middle" class="data-label" fill="#475569">2101µm²</text><text x="329.5" y="360" text-anchor="middle" font-size="10px" fill="#64748b">(151门/0.94ns)</text><rect x="364.5" y="337" width="42" height="68" fill="#f59e0b" rx="2"/><text x="385.5" y="319" text-anchor="middle" class="data-label" fill="#b45309">3631µm²</text><text x="385.5" y="331" text-anchor="middle" font-size="10px" font-weight="700" fill="#b45309">(+72.8%/5.22ns)</text><text x="357.5" y="427" text-anchor="middle" class="axis-label">16-bit 总线</text><text x="329.5" y="441" text-anchor="middle" class="tick-label">原始总线</text><text x="385.5" y="441" text-anchor="middle" class="tick-label">Bus-Invert</text><rect x="493.5" y="326" width="42" height="79" fill="#94a3b8" rx="2"/><text x="514.5" y="308" text-anchor="middle" class="data-label" fill="#475569">4238µm²</text><text x="514.5" y="320" text-anchor="middle" font-size="10px" fill="#64748b">(306门/0.94ns)</text><rect x="549.5" y="266" width="42" height="139" fill="#f59e0b" rx="2"/><text x="570.5" y="248" text-anchor="middle" class="data-label" fill="#b45309">7430µm²</text><text x="570.5" y="260" text-anchor="middle" font-size="10px" font-weight="700" fill="#b45309">(+75.3%/7.48ns)</text><text x="542.5" y="427" text-anchor="middle" class="axis-label">32-bit 总线</text><text x="514.5" y="441" text-anchor="middle" class="tick-label">原始总线</text><text x="570.5" y="441" text-anchor="middle" class="tick-label">Bus-Invert</text><rect x="678.5" y="250" width="42" height="155" fill="#94a3b8" rx="2"/><text x="699.5" y="232" text-anchor="middle" class="data-label" fill="#475569">8237µm²</text><text x="699.5" y="244" text-anchor="middle" font-size="10px" fill="#64748b">(643门/0.99ns)</text><rect x="734.5" y="121" width="42" height="284" fill="#f59e0b" rx="2"/><text x="755.5" y="103" text-anchor="middle" class="data-label" fill="#b45309">15136µm²</text><text x="755.5" y="115" text-anchor="middle" font-size="10px" font-weight="700" fill="#b45309">(+83.8%/8.24ns)</text><text x="727.5" y="427" text-anchor="middle" class="axis-label">64-bit 总线</text><text x="699.5" y="441" text-anchor="middle" class="tick-label">原始总线</text><text x="755.5" y="441" text-anchor="middle" class="tick-label">Bus-Invert</text><rect x="120" y="466" width="14" height="10" rx="2" fill="#94a3b8"/><text x="140" y="476" class="legend-text">原始总线物理标准单元面积 (µm²) 与关键路径延迟 (ns)</text><rect x="120" y="486" width="14" height="10" rx="2" fill="#f59e0b"/><text x="140" y="496" class="legend-text">Bus-Invert 物理面积 (面积增量 +63%~+84% / 延时延长至 4.7~8.2ns)</text></svg>
