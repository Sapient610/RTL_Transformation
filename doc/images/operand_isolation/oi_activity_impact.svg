<rect width="880" height="480" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="32" y="38" class="title">Sky130 ALU 操作数隔离：不同数据总线翻转活跃度 (10% vs 30% vs 60%) 对总功耗变化率的影响</text><text x="32" y="58" class="subtitle">对比分析：(左) 稀疏计算工况 (Valid=20%) 下总线翻转率彻底扭转收支平衡 vs (右) 突发休眠工况 (Valid=5%) 下高翻转率放大超额节能</text><text x="70" y="87" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13px" font-weight="700" fill="#1e293b">工况 A: 稀疏使能计算 (Valid Duty = 20% | 收支平衡临界翻转区)</text><text x="70" y="103" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11px" fill="#64748b">低活跃度(10%)导致开销反噬 (+5%)，高活跃度(60%)逆转为深度节能 (-25%)</text><line x1="70" y1="380" x2="415" y2="380" class="grid-line"/><text x="62" y="384" text-anchor="end" class="tick-label">-30%</text><line x1="70" y1="313" x2="415" y2="313" class="grid-line"/><text x="62" y="317" text-anchor="end" class="tick-label">-20%</text><line x1="70" y1="247" x2="415" y2="247" class="grid-line"/><text x="62" y="251" text-anchor="end" class="tick-label">-10%</text><line x1="70" y1="181" x2="415" y2="181" class="zero-line"/><text x="411" y="176" text-anchor="end" class="tick-label" fill="#475569" font-weight="700">0% 临界线</text><text x="62" y="185" text-anchor="end" class="tick-label">+0%</text><line x1="70" y1="115" x2="415" y2="115" class="grid-line"/><text x="62" y="119" text-anchor="end" class="tick-label">+10%</text><rect x="79.125" y="176" width="20" height="5" rx="2" fill="url(#grad-red)"/><text x="89.125" y="171" text-anchor="middle" class="data-label" fill="#e11d48">+0.9%</text><rect x="103.125" y="181" width="20" height="55" rx="2" fill="url(#grad-blue)"/><text x="113.125" y="248" text-anchor="middle" class="data-label" fill="#0284c7">-8.4%</text><rect x="127.125" y="181" width="20" height="127" rx="2" fill="url(#grad-green)"/><text x="137.125" y="320" text-anchor="middle" class="data-label" fill="#059669">-19.2%</text><text x="113.125" y="404" text-anchor="middle" class="axis-label">8-bit</text><rect x="165.375" y="150" width="20" height="31" rx="2" fill="url(#grad-red)"/><text x="175.375" y="145" text-anchor="middle" class="data-label" fill="#e11d48">+4.8%</text><rect x="189.375" y="181" width="20" height="58" rx="2" fill="url(#grad-blue)"/><text x="199.375" y="251" text-anchor="middle" class="data-label" fill="#0284c7">-8.8%</text><rect x="213.375" y="181" width="20" height="135" rx="2" fill="url(#grad-green)"/><text x="223.375" y="328" text-anchor="middle" class="data-label" fill="#059669">-20.5%</text><text x="199.375" y="404" text-anchor="middle" class="axis-label">16-bit</text><rect x="251.625" y="144" width="20" height="37" rx="2" fill="url(#grad-red)"/><text x="261.625" y="139" text-anchor="middle" class="data-label" fill="#e11d48">+5.7%</text><rect x="275.625" y="181" width="20" height="59" rx="2" fill="url(#grad-blue)"/><text x="285.625" y="252" text-anchor="middle" class="data-label" fill="#0284c7">-9.0%</text><rect x="299.625" y="181" width="20" height="144" rx="2" fill="url(#grad-green)"/><text x="309.625" y="337" text-anchor="middle" class="data-label" fill="#059669">-21.9%</text><text x="285.625" y="404" text-anchor="middle" class="axis-label">32-bit</text><rect x="337.875" y="162" width="20" height="19" rx="2" fill="url(#grad-red)"/><text x="347.875" y="157" text-anchor="middle" class="data-label" fill="#e11d48">+2.9%</text><rect x="361.875" y="181" width="20" height="85" rx="2" fill="url(#grad-blue)"/><text x="371.875" y="278" text-anchor="middle" class="data-label" fill="#0284c7">-12.9%</text><rect x="385.875" y="181" width="20" height="163" rx="2" fill="url(#grad-green)"/><text x="395.875" y="356" text-anchor="middle" class="data-label" fill="#059669">-24.7%</text><text x="371.875" y="404" text-anchor="middle" class="axis-label">64-bit</text><text x="485" y="87" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13px" font-weight="700" fill="#1e293b">工况 B: 突发休眠模式 (Valid Duty = 5% | 深度节电区)</text><text x="485" y="103" font-family="-apple-system, BlinkM