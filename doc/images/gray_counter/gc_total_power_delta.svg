    <stop offset="100%" stop-color="#e11d48" />
  </linearGradient>
</defs>
<rect width="840" height="450" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="32" y="38" class="title">Sky130 格雷码计数器：各规模在不同使能活跃度下的总功耗变化率</text><text x="32" y="58" class="subtitle">基准时钟: 100MHz | 基准: 纯二进制累加计数器 (N DFF) | 负值向下为节能收益，正值向上为次态异或开销反噬</text><line x1="85" y1="360" x2="795" y2="360" class="grid-line"/><text x="75" y="364" text-anchor="end" class="tick-label">-15%</text><line x1="85" y1="320" x2="795" y2="320" class="grid-line"/><text x="75" y="324" text-anchor="end" class="tick-label">-10%</text><line x1="85" y1="281" x2="795" y2="281" class="grid-line"/><text x="75" y="285" text-anchor="end" class="tick-label">-5%</text><line x1="85" y1="242" x2="795" y2="242" class="zero-line"/><text x="803" y="246" class="tick-label" fill="#475569" font-weight="600">0% 损益平衡线</text><text x="75" y="246" text-anchor="end" class="tick-label">+0%</text><line x1="85" y1="202" x2="795" y2="202" class="grid-line"/><text x="75" y="206" text-anchor="end" class="tick-label">+5%</text><line x1="85" y1="163" x2="795" y2="163" class="grid-line"/><text x="75" y="167" text-anchor="end" class="tick-label">+10%</text><line x1="85" y1="124" x2="795" y2="124" class="grid-line"/><text x="75" y="128" text-anchor="end" class="tick-label">+15%</text><line x1="85" y1="85" x2="795" y2="85" class="grid-line"/><text x="75" y="89" text-anchor="end" class="tick-label">+20%</text><rect x="100.75" y="242" width="32" height="4" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="116.75" y="260" text-anchor="middle" class="data-label" fill="#047857">-0.6%</text><rect x="138.75" y="242" width="32" height="24" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="154.75" y="280" text-anchor="middle" class="data-label" fill="#047857">-3.1%</text><rect x="176.75" y="242" width="32" height="44" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="192.75" y="300" text-anchor="middle" class="data-label" fill="#047857">-5.6%</text><rect x="214.75" y="242" width="32" height="58" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="230.75" y="314" text-anchor="middle" class="data-label" fill="#047857">-7.5%</text><text x="173.75" y="395" text-anchor="middle" class="axis-label">4-bit 计数器</text><rect x="278.25" y="235" width="32" height="7" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="294.25" y="230" text-anchor="middle" class="data-label" fill="#dc2626">+1.0%</text><rect x="316.25" y="214" width="32" height="28" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="332.25" y="209" text-anchor="middle" class="data-label" fill="#dc2626">+3.7%</text><rect x="354.25" y="183" width="32" height="59" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="370.25" y="178" text-anchor="middle" class="data-label" fill="#dc2626">+7.6%</text><rect x="392.25" y="159" width="32" height="83" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="408.25" y="154" text-anchor="middle" class="data-label" fill="#dc2626">+10.6%</text><text x="351.25" y="395" text-anchor="middle" class="axis-label">8-bit 计数器</text><rect x="455.75" y="242" width="32" height="30" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="471.75" y="286" text-anchor="middle" class="data-label" fill="#047857">-3.9%</text><rect x="493.75" y="242" width="32" height="0" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="509.75" y="237" text-anchor="middle" class="data-label" fill="#dc2626">+0.0%</text><rect x="531.75" y="201" width="32" height="41" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="547.75" y="196" text-anchor="middle" class="data-label" fill="#dc2626">+5.3%</text><rect x="569.75" y="175" width="32" height="67" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="585.75" y="170" text-anchor="middle" class="data-label" fill="#dc2626">+8.6%</text><text x="528.75" y="395" text-anchor="middle" class="axis-label">16-bit 计数器</text><rect x="633.25" y="206" width="32" height="36" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="649.25" y="201" text-anchor="middle" class="data-label" fill="#dc2626">+4.6%</text><rect x="671.25" y="188" width="32" height="54" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="687.25" y="183" text-anchor="middle" class="data-label" fill="#dc2626">+6.9%</text><rect x="709.25" y="158" width="32" height="84" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="725.25" y="153" text-anchor="middle" class="data-label" fill="#dc2626">+10.7%</text><rect x="747.25" y="137" width="32" height="105" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="763.25" y="132" text-anchor="middle" class="data-label" fill="#dc2626">+13.5%</text><text x="706.25" y="395" text-anchor="middle" class="axis-label">32-bit 计数器</text><rect x="195" y="426" width="14" height="10" rx="2" fill="url(#grad-green)"/><text x="213" y="436" class="legend-text">使能 5% 活跃度 (空闲突发)</text><rect x="350" y="426" width="14" height="10" rx="2" fill="url(#grad-blue)"/><text x="368" y="436" class="legend-text">使能 20% 活跃度 (常规工况)</text><rect x="505" y="426" width="14" height="10" rx="2" fill="url(#grad-amber)"/><text x="523" y="436" class="legend-text">使能 50% 活跃度 (平衡工况)</text><rect x="660" y="426" width="14" height="10" rx="2" fill="url(#grad-red)"/><text x="678" y="436" class="legend-text">使能 80% 活跃度 (高频计数)</text></svg>
