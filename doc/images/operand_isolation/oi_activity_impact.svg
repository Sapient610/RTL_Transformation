xt><text x="614.375" y="404" text-anchor="middle" class="axis-label">16-bit</text><rect x="666.625" y="115" width="20" height="155" rx="2" fill="url(#grad-amber)"/><text x="676.625" y="282" text-anchor="middle" class="data-label" fill="#d97706">-35.2%</text><rect x="690.625" y="115" width="20" height="170" rx="2" fill="url(#grad-blue)"/><text x="700.625" y="297" text-anchor="middle" class="data-label" fill="#0284c7">-38.6%</text><rect x="714.625" y="115" width="20" height="226" rx="2" fill="url(#grad-green)"/><text x="724.625" y="353" text-anchor="middle" class="data-label" fill="#059669">-51.2%</text><text x="700.625" y="404" text-anchor="middle" class="axis-label">32-bit</text><rect x="752.875" y="115" width="20" height="171" rx="2" fill="url(#grad-amber)"/><text x="762.875" y="298" text-anchor="middle" class="data-label" fill="#d97706">-38.8%</text><rect x="776.875" y="115" width="20" height="186" rx="2" fill="url(#grad-blue)"/><text x="786.875" y="313" text-anchor="middle" class="data-label" fill="#0284c7">-42.2%</text><rect x="800.875" y="115" width="20" height="240" rx="2" fill="url(#grad-green)"/><text x="810.875" y="367" text-anchor="middle" class="data-label" fill="#059669">-54.4%</text><text x="786.875" y="404" text-anchor="middle" class="axis-label">64-bit</text><rect x="130" y="452" width="16" height="12" rx="2" fill="url(#grad-red)"/><text x="154" y="462" class="legend-text">数据总线翻转率 10% (低噪声总线)</text><rect x="360" y="452" width="16" height="12" rx="2" fill="url(#grad-blue)"/><text x="384" y="462" class="legend-text">数据总线翻转率 30% (中噪声总线)</text><rect x="590" y="452" width="16" height="12" rx="2" fill="url(#grad-green)"/><text x="614" y="462" class="legend-text">数据总线翻转率 60% (高噪声总线)</text></svg>
