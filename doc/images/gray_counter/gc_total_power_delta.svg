l="#047857">-27.8%</text><text x="173.75" y="395" text-anchor="middle" class="axis-label">4-bit 计数器</text><rect x="278.25" y="121" width="32" height="105" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="294.25" y="240" text-anchor="middle" class="data-label" fill="#047857">-28.7%</text><rect x="316.25" y="121" width="32" height="97" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="332.25" y="232" text-anchor="middle" class="data-label" fill="#047857">-26.6%</text><rect x="354.25" y="121" width="32" height="86" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="370.25" y="221" text-anchor="middle" class="data-label" fill="#047857">-23.5%</text><rect x="392.25" y="121" width="32" height="76" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="408.25" y="211" text-anchor="middle" class="data-label" fill="#047857">-20.9%</text><text x="351.25" y="395" text-anchor="middle" class="axis-label">8-bit 计数器</text><rect x="455.75" y="121" width="32" height="169" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="471.75" y="304" text-anchor="middle" class="data-label" fill="#047857">-46.2%</text><rect x="493.75" y="121" width="32" height="159" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="509.75" y="294" text-anchor="middle" class="data-label" fill="#047857">-43.5%</text><rect x="531.75" y="121" width="32" height="146" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="547.75" y="281" text-anchor="middle" class="data-label" fill="#047857">-39.9%</text><rect x="569.75" y="121" width="32" height="137" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="585.75" y="272" text-anchor="middle" class="data-label" fill="#047857">-37.4%</text><text x="528.75" y="395" text-anchor="middle" class="axis-label">16-bit 计数器</text><rect x="633.25" y="121" width="32" height="198" fill="url(#grad-green)" rx="3" opacity="0.9"/><text x="649.25" y="333" text-anchor="middle" class="data-label" fill="#047857">-54.0%</text><rect x="671.25" y="121" width="32" height="192" fill="url(#grad-blue)" rx="3" opacity="0.9"/><text x="687.25" y="327" text-anchor="middle" class="data-label" fill="#047857">-52.5%</text><rect x="709.25" y="121" width="32" height="183" fill="url(#grad-amber)" rx="3" opacity="0.9"/><text x="725.25" y="318" text-anchor="middle" class="data-label" fill="#047857">-50.1%</text><rect x="747.25" y="121" width="32" height="176" fill="url(#grad-red)" rx="3" opacity="0.9"/><text x="763.25" y="311" text-anchor="middle" class="data-label" fill="#047857">-48.2%</text><text x="706.25" y="395" text-anchor="middle" class="axis-label">32-bit 计数器</text><rect x="195" y="426" width="14" height="10" rx="2" fill="url(#grad-green)"/><text x="213" y="436" class="legend-text">使能 5% 活跃度 (空闲突发)</text><rect x="350" y="426" width="14" height="10" rx="2" fill="url(#grad-blue)"/><text x="368" y="436" class="legend-text">使能 20% 活跃度 (常规工况)</text><rect x="505" y="426" width="14" height="10" rx="2" fill="url(#grad-amber)"/><text x="523" y="436" class="legend-text">使能 50% 活跃度 (平衡工况)</text><rect x="660" y="426" width="14" height="10" rx="2" fill="url(#grad-red)"/><text x="678" y="436" class="legend-text">使能 80% 活跃度 (高频计数)</text></svg>
