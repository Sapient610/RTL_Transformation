<text x="450.0" y="36" text-anchor="middle" class="title">Sky130 总线反转编码 (Bus-Invert) 动态翻转功耗相对变化率 (Switching Power Delta %)</text><text x="450.0" y="56" text-anchor="middle" class="subtitle">标称 Pad 负载 (10.0 pF) 下动态翻转功耗显著缩减 | 85% 翻转率下总线翻转被强制截断在 50% 以下，翻转功耗暴降超 -67% ~ -77%</text><line x1="80" y1="405" x2="830" y2="405" class="grid-line"/><text x="70" y="409" text-anchor="end" class="tick-label">-80%</text><line x1="80" y1="371" x2="830" y2="371" class="grid-line"/><text x="70" y="375" text-anchor="end" class="tick-label">-70%</text><line x1="80" y1="337" x2="830" y2="337" class="grid-line"/><text x="70" y="341" text-anchor="end" class="tick-label">-60%</text><line x1="80" y1="303" x2="830" y2="303" class="grid-line"/><text x="70" y="307" text-anchor="end" class="tick-label">-50%</text><line x1="80" y1="270" x2="830" y2="270" class="grid-line"/><text x="70" y="274" text-anchor="end" class="tick-label">-40%</text><line x1="80" y1="236" x2="830" y2="236" class="grid-line"/><text x="70" y="240" text-anchor="end" class="tick-label">-30%</text><line x1="80" y1="202" x2="830" y2="202" class="grid-line"/><text x="70" y="206" text-anchor="end" class="tick-label">-20%</text><line x1="80" y1="169" x2="830" y2="169" class="grid-line"/><text x="70" y="173" text-anchor="end" class="tick-label">-10%</text><line x1="80" y1="135" x2="830" y2="135" class="zero-line"/><text x="70" y="139" text-anchor="end" class="tick-label">+0%</text><line x1="80" y1="101" x2="830" y2="101" class="grid-line"/><text x="70" y="105" text-anchor="end" class="tick-label">+10%</text><line x1="80" y1="135" x2="830" y2="135" class="zero-line"/><text x="822" y="129" text-anchor="end" font-size="10px" font-weight="700" fill="#475569">0.0% 损益基准线 (Raw Bus)</text><rect x="93.75" y="130" width="34" height="5" fill="#f59e0b" rx="3"/><text x="110.75" y="124" text-anchor="middle" class="data-label" fill="#f59e0b">+1.5%</text><rect x="135.75" y="135" width="34" height="7" fill="#0ea5e9" rx="3"/><text x="152.75" y="154" te